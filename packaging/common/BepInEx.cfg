[Preloader]

# Crawl uses Unity 5.4's old Mono runtime. BepInEx's optional runtime fixes use
# detours that this Mono build cannot compile. Plugin-level Harmony remains
# available when these runtime patches are disabled.
ApplyRuntimePatches = false
HarmonyBackend = cecil

[Preloader.Entrypoint]
# Starting the chainloader from UnityEngine's static constructor is too early
# for Unity 5.4 and corrupts its script serialization map. SystemSteam.Awake is
# invoked only after Assembly-CSharp and scene script metadata are ready.
Assembly = Assembly-CSharp.dll
Type = SystemSteam
Method = Awake
